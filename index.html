<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Task Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>TaskFlow</h1>
            <p>Organize your work. Stay productive.</p>
        </div>
    </header>

    <main class="container">

        <section class="task-form-section">
            <h2>Create a Task</h2>

            <form id="task-form" novalidate>
                
                <div
    id="form-message"
    class="form-message"
    role="alert"
    aria-live="polite"
></div>
            

                <div class="form-group">
                    <label for="task-title">Task Title</label>
                    <input
                        type="text"
                        id="task-title"
                        placeholder="Enter task title"
                    >
                </div>

                <div class="form-group">
                    <label for="task-description">Description</label>
                    <textarea
                        id="task-description"
                        placeholder="Enter task description"
                    ></textarea>
                </div>
                <div class="form-group">
    <label for="task-priority">Priority</label>

    <select id="task-priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
    </select>
</div>

<div class="form-group">
    <label for="task-due-date">Due Date</label>

    <input
        type="date"
        id="task-due-date"
    >
</div>

                <button type="submit">Add Task</button>

            </form>
        </section>


        <section class="statistics">

    <div class="stat-card">
        <h3>Total</h3>
        <span id="total-tasks">0</span>
    </div>

    <div class="stat-card">
        <h3>Pending</h3>
        <span id="pending-tasks">0</span>
    </div>

    <div class="stat-card">
        <h3>Completed</h3>
        <span id="completed-tasks">0</span>
    </div>

    <div class="stat-card">
        <h3>High Priority</h3>
        <span id="high-priority-tasks">0</span>
    </div>

</section>

<section class="progress-section">

    <div class="progress-header">
        <h2>Task Progress</h2>
        <span id="completion-percentage">0%</span>
    </div>

    <div class="progress-bar">
        <div
            id="completion-progress"
            class="progress-fill"
        ></div>
    </div>

</section>


        <section class="tasks-section"> 

    <div class="section-header"> 
        <h2>My Tasks</h2> 

        <div class="task-controls">

            <label for="task-search" class="visually-hidden">
    Search tasks
</label>

<input
    type="search"
    id="task-search"
    placeholder="Search tasks..."
    aria-label="Search tasks"
>
            >

            <label for="task-filter" class="visually-hidden">
    Filter tasks
</label>

<select id="task-filter" aria-label="Filter tasks"> 
                <option value="all">All Tasks</option> 
                <option value="pending">Pending</option> 
                <option value="completed">Completed</option> 
            </select>

        </div>

    </div> 

    <div id="task-list"> 

        <div class="empty-state"> 
            <p>No tasks yet. Create your first task!</p> 
        </div> 

    </div> 

</section>

    </main>


    <footer>
        <p>&copy; 2026 TaskFlow</p>
    </footer>

    <script src="js/script.js"></script>

</form>
</html>
